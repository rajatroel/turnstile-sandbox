<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Check - Replica Testing</title>
    <!-- Cloudflare Turnstile API -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        * { box-sizing: border-box; }

        html, body { height: 100%; }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #ffffff;
            color: #212529;
        }

        /* ---------- Header ---------- */
        .site-header {
            background: #fafafa;
            padding: 18px 18px 14px 18px;
            border-bottom: 2px solid #a8d5e5;
        }
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            font-family: "Montserrat", "Segoe UI", Roboto, Arial, sans-serif;
            font-size: 34px;
            line-height: 1;
            letter-spacing: -0.5px;
        }
        .logo .brand-1 { color: #d6246e; font-weight: 400; }
        .logo .brand-2 { color: #7b3f98; font-weight: 700; }
        .logo .badge-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3cb4e6 0%, #1f8fc9 100%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0 -2px;
        }

        /* ---------- Nav bar ---------- */
        .navbar {
            background: #f8f9fa;
            padding: 8px 8px;
        }
        .navbar-toggler {
            width: 46px;
            height: 38px;
            border: 1px solid #c9ccd0;
            border-radius: 6px;
            background: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
        }
        .navbar-toggler span,
        .navbar-toggler span::before,
        .navbar-toggler span::after {
            display: block;
            width: 20px;
            height: 2px;
            background: #6b7075;
            position: relative;
            content: "";
        }
        .navbar-toggler span::before { position: absolute; top: -6px; }
        .navbar-toggler span::after  { position: absolute; top: 6px; }

        /* ---------- Main / Card ---------- */
        main {
            flex: 1;
            padding: 36px 8px 24px 8px;
        }
        .card {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            border: 1px solid #d5d8dc;
            border-radius: 24px;
            padding: 24px 24px 22px 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }
        .card h2 {
            margin: 0 0 10px 0;
            font-size: 22px;
            font-weight: 500;
            color: #212529;
        }
        .card h2.success-title {
            color: #198754;
        }
        .instructions {
            margin: 0 0 18px 0;
            font-size: 15px;
            line-height: 1.55;
            color: #5c6166;
        }

        .cf-wrapper {
            display: block;
            margin-bottom: 22px;
            min-height: 65px;
        }

        .input-group { margin-bottom: 14px; }
        .input-label {
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
            color: #212529;
        }
        input[type="text"] {
            width: 100%;
            height: 50px;
            padding: 0 14px;
            font-size: 16px;
            color: #212529;
            background: #fff;
            border: 1px solid #ced4da;
            border-radius: 10px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        input[type="text"]::placeholder { color: #6c757d; }
        input[type="text"]:focus {
            border-color: #86b7fe;
            box-shadow: 0 0 0 .2rem rgba(13, 110, 253, .2);
        }

        .btn {
            display: block;
            width: 100%;
            height: 50px;
            font-size: 18px;
            font-weight: 400;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color .15s, color .15s;
        }
        .btn-primary {
            background: #0d6efd;
            color: #fff;
            border: 1px solid #0d6efd;
        }
        .btn-primary:active { background: #0a58ca; }
        .btn-outline {
            background: transparent;
            color: #6c757d;
            border: 1px solid #6c757d;
            height: 46px;
            font-size: 17px;
        }
        .btn-outline:active { background: #6c757d; color: #fff; }

        #feedback-message {
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            margin-top: 12px;
            min-height: 18px;
        }

        .timer-container {
            display: flex;
            justify-content: center;
            margin-top: 12px;
            min-height: 26px;
        }
        .timer-badge {
            background: #6c757d;
            color: #fff;
            padding: 5px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 700;
        }
        .timer-badge.failed {
            background: transparent;
            color: #d93025;
            font-size: 14px;
        }

        .alert-success {
            background: #d1e7dd;
            border: 1px solid #a3cfbb;
            color: #0a3622;
            border-radius: 8px;
            padding: 16px 16px;
            font-size: 17px;
            margin: 16px 0;
        }

        .hidden { display: none !important; }

        /* ---------- Footer ---------- */
        .site-footer {
            border-top: 2px solid #a8d5e5;
            background: #fff;
            text-align: center;
            padding: 28px 16px 36px 16px;
            font-size: 17px;
            color: #212529;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="site-header">
        <a class="logo" href="#" aria-label="Replica Testing">
            <span class="brand-1">Replica</span>
            <span class="badge-icon" aria-hidden="true">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 12.5l4.5 4.5L19 7.5"/>
                </svg>
            </span>
            <span class="brand-2">testing</span>
        </a>
    </header>

    <!-- Nav -->
    <nav class="navbar">
        <button class="navbar-toggler" type="button" aria-label="Toggle navigation"><span></span></button>
    </nav>

    <!-- Main -->
    <main>
        <!-- Verification card -->
        <div class="card" id="verify-card">
            <h2>Security check</h2>

            <p class="instructions">
                Find the Telegram image with emoji 😎, solve the math operation displayed there, and submit the result below after completing the Cloudflare challenge.
            </p>

            <div class="cf-wrapper">
                <!-- Testing Sitekey: replace with your production sitekey -->
                <div class="cf-turnstile"
                     data-sitekey="3x00000000000000000000FF"
                     data-size="flexible"
                     data-callback="onTurnstileSuccess"></div>
            </div>

            <div class="input-group">
                <label class="input-label" for="captcha-answer">Answer</label>
                <input type="text" id="captcha-answer" placeholder="Enter answer" autocomplete="off">
            </div>

            <button type="button" class="btn btn-primary" onclick="verifySubmission()">Submit</button>

            <div id="feedback-message"></div>

            <div class="timer-container">
                <div class="timer-badge" id="timer-display">Time left: 60 sec</div>
            </div>
        </div>

        <!-- Success card -->
        <div class="card hidden" id="success-card">
            <h2 class="success-title">Verification passed</h2>
            <div class="alert-success">Thanks! You can return to the bot.</div>
            <button type="button" class="btn btn-outline" onclick="goBackToBot()">Back to bot</button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        Copyright &copy; <span id="year">2025</span>. All rights reserved.
    </footer>

    <script>
        // Set this to your bot's link, e.g. "https://t.me/your_bot_username"
        const BOT_URL = "#";

        document.getElementById('year').textContent = new Date().getFullYear();

        // ---------- Timer ----------
        let timeLeft = 60;
        let verified = false;
        const timerDisplay = document.getElementById('timer-display');

        const timerInterval = setInterval(() => {
            if (verified) { clearInterval(timerInterval); return; }
            timeLeft--;
            if (timeLeft > 0) {
                timerDisplay.innerText = `Time left: ${timeLeft} sec`;
            } else {
                clearInterval(timerInterval);
                timerDisplay.classList.add('failed');
                timerDisplay.innerText = "Captcha verification failed.";
            }
        }, 1000);

        // ---------- Turnstile & validation ----------
        let isHuman = false;

        function onTurnstileSuccess() {
            isHuman = true;
        }

        function verifySubmission() {
            const answerField = document.getElementById('captcha-answer');
            const feedbackText = document.getElementById('feedback-message');
            const answer = answerField.value.trim();

            if (timeLeft <= 0) {
                return;
            }

            if (!isHuman) {
                feedbackText.style.color = "#d93025";
                feedbackText.innerText = "Error: Complete the Cloudflare widget first.";
                return;
            }

            if (answer === "") {
                feedbackText.style.color = "#d93025";
                feedbackText.innerText = "Invalid answer.";
                return;
            }

            if (answer === "7" || answer === "17") {
                verified = true;
                clearInterval(timerInterval);
                document.getElementById('verify-card').classList.add('hidden');
                document.getElementById('success-card').classList.remove('hidden');
            } else {
                feedbackText.style.color = "#d93025";
                feedbackText.innerText = "Invalid answer.";
            }
        }

        function goBackToBot() {
            if (BOT_URL && BOT_URL !== "#") {
                window.location.href = BOT_URL;
            }
        }

        // Enter key submits
        document.getElementById('captcha-answer').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                verifySubmission();
            }
        });
    </script>
</body>
</html>
