<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Check</title>
    <!-- Cloudflare Turnstile API -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .card {
            background: white;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }
        h2 {
            margin: 0 0 12px 0;
            color: #202124;
            font-size: 20px;
            font-weight: 500;
        }
        .instructions {
            font-size: 13px;
            color: #5f6368;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .cf-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            background-color: #f9f9f9;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        .input-group {
            margin-bottom: 16px;
            position: relative;
        }
        .input-label {
            font-size: 11px;
            color: #5f6368;
            position: absolute;
            top: -8px;
            left: 12px;
            background: white;
            padding: 0 4px;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px 12px;
            border: 2px solid #d2e3fc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #1a73e8;
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        button:active {
            background-color: #1557b0;
        }
        .timer-container {
            display: flex;
            justify-content: center;
            margin-top: 16px;
        }
        .timer-badge {
            background-color: #757575;
            color: white;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 11px;
            font-weight: 500;
        }
        #feedback-message {
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            margin-top: 12px;
            min-height: 16px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Security check</h2>
        
        <p class="instructions">
            Find the Telegram image with emoji ♠, solve the math operation displayed there, and submit the result below after completing the Cloudflare challenge.
        </p>
        
        <div class="cf-wrapper">
            <!-- Testing Sitekey (Forces interactive widget) -->
            <div class="cf-turnstile" data-sitekey="3x00000000000000000000FF" data-callback="onTurnstileSuccess"></div>
        </div>

        <div class="input-group">
            <label class="input-label" for="captcha-answer">Answer</label>
            <!-- Exact ID requested by the Python script -->
            <input type="text" id="captcha-answer" placeholder="Enter answer">
        </div>

        <!-- Android UIAutomator reads this as className="android.widget.Button" text="Submit" -->
        <button type="button" onclick="verifySubmission()">Submit</button>

        <div id="feedback-message"></div>

        <div class="timer-container">
            <div class="timer-badge">Time left: 14 sec</div>
        </div>
    </div>

    <script>
        let isHuman = false;

        function onTurnstileSuccess() {
            isHuman = true;
        }

        function verifySubmission() {
            const answerField = document.getElementById('captcha-answer');
            const feedbackText = document.getElementById('feedback-message');
            const answer = answerField.value.trim();

            if (!isHuman) {
                feedbackText.style.color = "#d93025";
                feedbackText.innerText = "Error: Complete the Cloudflare widget first.";
                return;
            }

            // Checks specifically for 17 or 7 as valid answers
            if (answer === "17" || answer === "7") {
                feedbackText.style.color = "#188038";
                feedbackText.innerText = "Success! Verification complete.";
            } else {
                feedbackText.style.color = "#d93025";
                feedbackText.innerText = "Incorrect answer. Try again.";
            }
        }
    </script>
</body>
</html>
